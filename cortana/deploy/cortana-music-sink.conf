# ~/.config/pipewire/pipewire.conf.d/cortana-music.conf
# Silent output that the Apple Music player and AirPlay play into; streamer.py
# records its monitor and sends it to the Invoke speaker.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "cortana_music"
      node.description = "Cortana Music"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      audio.rate       = 48000
    }
  }
]
