# Optional drop-in: /etc/systemd/system/cortana-bridge.service.d/gpu.conf
# Speech-to-text on an NVIDIA GPU (falls back to the CPU if CUDA isn't usable).
# Needs the NVIDIA driver and: pip install nvidia-cublas-cu12 "nvidia-cudnn-cu12==9.*"
[Service]
Environment=BRIDGE_STT_DEVICE=cuda
Environment=BRIDGE_STT_COMPUTE=float16
Environment=BRIDGE_STT_MODEL=medium.en
Environment=LD_LIBRARY_PATH=@SITE@/nvidia/cublas/lib:@SITE@/nvidia/cudnn/lib:@SITE@/nvidia/cuda_nvrtc/lib
