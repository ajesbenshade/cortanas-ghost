// AirPlay receiver "Cortana" (shairport-sync, run by cortana-airplay.service).
// Plays into the PipeWire sink that streamer.py sends to the Invoke speaker,
// so AirPlay from an iPhone, iPad or Mac ends up on the speaker.
general = {
    name = "Cortana";
    output_backend = "pa";
    interpolation = "soxr";      // smooth clock drift correction
    volume_range_db = 60;
    // Now-playing and play/pause/next/previous over MPRIS on the user's session
    // bus, so the bridge can show AirPlay on the speaker's dashboard.
    dbus_service_bus = "session";
    mpris_service_bus = "session";
};

metadata = {
    enabled = "yes";
    include_cover_art = "no";
};

sessioncontrol = {
    allow_session_interruption = "yes";   // a second device can take over
    session_timeout = 20;
};

pa = {
    sink = "cortana_music";
    application_name = "AirPlay";
};
